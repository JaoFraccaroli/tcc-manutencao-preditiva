[pytest]
testpaths = tests
pythonpath = .
addopts = -ra
markers =
    defeito: teste que documenta um defeito encontrado (xfail estrito)
    lento: teste demorado (treino de modelo), pulado no teste de mutação
bdd_features_base_dir = tests/bdd/features
filterwarnings =
    ignore::DeprecationWarning
