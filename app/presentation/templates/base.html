<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Manutenção Preditiva{% endblock %}</title>
  <style>
    :root {
      --bg: #f5f6f8;
      --card: #ffffff;
      --texto: #1f2530;
      --texto-suave: #5b6472;
      --borda: #e3e6ea;
      --azul: #2f6fed;
      --vermelho: #d64545;
      --verde: #2f9e6a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background: var(--bg);
      color: var(--texto);
    }
    header {
      background: var(--card);
      border-bottom: 1px solid var(--borda);
      padding: 14px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header .marca { font-weight: 600; font-size: 1.1rem; }
    nav a {
      margin-left: 20px;
      color: var(--texto-suave);
      text-decoration: none;
      font-size: 0.92rem;
    }
    nav a:hover { color: var(--azul); }
    main { padding: 28px; max-width: 1180px; margin: 0 auto; }
    .card {
      background: var(--card);
      border: 1px solid var(--borda);
      border-radius: 10px;
      padding: 18px 22px;
      margin-bottom: 20px;
    }
    .grid { display: grid; gap: 20px; }
    .grid-4 { grid-template-columns: repeat(4, 1fr); }
    .grid-2 { grid-template-columns: repeat(2, 1fr); }
    @media (max-width: 900px) { .grid-4, .grid-2 { grid-template-columns: 1fr; } }
    .stat-valor { font-size: 1.7rem; font-weight: 700; }
    .stat-rotulo { color: var(--texto-suave); font-size: 0.85rem; }
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--borda); }
    th { color: var(--texto-suave); font-weight: 600; }
    th a { color: inherit; text-decoration: none; }
    th a:hover { color: var(--azul); }
    tr:hover td { background: #fafbfc; }
    img.grafico { max-width: 100%; border-radius: 6px; }
    .badge {
      display: inline-block;
      padding: 2px 9px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 600;
    }
    .badge-alerta { background: #fdeaea; color: var(--vermelho); }
    .badge-normal { background: #e8f5ee; color: var(--verde); }
    .aviso {
      background: #fff8e6;
      border: 1px solid #f0dca0;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.85rem;
      color: #6b5300;
      margin-bottom: 20px;
    }
    .paginacao { margin-top: 14px; font-size: 0.9rem; }
    .paginacao a { margin-right: 10px; color: var(--azul); text-decoration: none; }
    h1 { font-size: 1.4rem; margin: 0 0 6px; }
    h2 { font-size: 1.05rem; margin: 0 0 10px; color: var(--texto); }
    .muted { color: var(--texto-suave); }
    a.voltar { color: var(--azul); text-decoration: none; font-size: 0.9rem; }
    .mensagem { border-radius: 8px; padding: 10px 14px; font-size: 0.88rem; margin-bottom: 18px; }
    .mensagem-erro { background: #fdeaea; color: var(--vermelho); border: 1px solid #f3c6c6; }
    .mensagem-sucesso { background: #e8f5ee; color: var(--verde); border: 1px solid #bfe3cf; }
    form.form-cadastro { display: grid; gap: 12px; max-width: 520px; }
    form.form-cadastro label { display: block; font-size: 0.85rem; color: var(--texto-suave); margin-bottom: 4px; }
    form.form-cadastro input, form.form-cadastro textarea {
      width: 100%; padding: 7px 10px; border: 1px solid var(--borda); border-radius: 6px; font-size: 0.9rem;
      font-family: inherit;
    }
    form.form-cadastro button {
      justify-self: start; padding: 8px 18px; border-radius: 6px; border: none;
      background: var(--azul); color: #fff; font-size: 0.9rem; cursor: pointer;
    }
    form.form-cadastro button:hover { opacity: 0.9; }
    details.form-nova { margin-bottom: 20px; }
    details.form-nova summary { cursor: pointer; color: var(--azul); font-size: 0.9rem; margin-bottom: 10px; }
  </style>
</head>
<body>
  <header>
    <div class="marca">Manutenção Preditiva</div>
    <nav>
      <a href="/">Visão geral</a>
      <a href="/equipamentos">Equipamentos</a>
      <a href="/maquinas">Máquinas</a>
      <a href="/componentes">Componentes</a>
      <a href="/modelos">Modelos</a>
      <a href="/analise-exploratoria">Análise exploratória</a>
      <a href="/analise-textual">Descrições de falha</a>
    </nav>
  </header>
  <main>
    {% with mensagens = get_flashed_messages(with_categories=true) %}
      {% for categoria, texto in mensagens %}
        <div class="mensagem mensagem-{{ 'erro' if categoria == 'erro' else 'sucesso' }}">{{ texto }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
